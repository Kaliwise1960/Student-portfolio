<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ebenyam Monday</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Ebenyam Monday | Academic Portfolio</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="planner.html">Academic Planner</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card form-container">
            <h2>Get In Touch</h2>
            <p>Send a message regarding academic inquiries, project collaborations, or web security discussions.</p>

            <div id="formFeedback" class="feedback-msg"></div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g., student@miva.edu.ng">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="e.g., 08012345678 (digits only)">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit" class="btn primary-btn">Submit Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Ebenyam Monday - MIVA Open University. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
